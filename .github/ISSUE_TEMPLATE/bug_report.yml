name: Bug report
description: Report something in GhostlyShare that is not working as expected.
title: "[Bug]: "
labels:
  - bug
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a GhostlyShare issue.

        Check the [Troubleshooting guide](https://github.com/Nix1983/GhostlyShare-Releases/blob/main/wiki/Troubleshooting.md) first. Never paste Cloudflare API tokens, passwords, private URLs, customer data, or unredacted logs.

  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Desktop app
        - ghs CLI
        - Both
        - Documentation or downloads
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did the problem happen?
      options:
        - Windows
        - Windows with WSL
        - Ubuntu / Debian / Linux Mint / Kali / Pop!_OS
        - Arch Linux
        - Fedora / openSUSE / RHEL-compatible Linux
        - Other Linux desktop
        - Docker workload
        - More than one platform
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GhostlyShare version
      description: Use the version shown in GhostlyShare or by `ghs version`.
      placeholder: "Example: 1.3.1.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: What is affected?
      options:
        - App detection
        - Discovery diagnostics
        - LAN sharing
        - Go Public / random URL
        - Custom domain
        - Password protection
        - Link lifetime
        - Traffic statistics
        - Browser opening
        - CLI or JSON output
        - Public link health / auto-stop
        - Cloudflare token storage
        - Tunnel or DNS cleanup
        - Tray icon or window behavior
        - Installation, update, or uninstall
        - Documentation
        - Something else
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect GhostlyShare to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact safe error message.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Start my local app with ...
        2. Open GhostlyShare or run ...
        3. Select ...
        4. See ...
    validations:
      required: true

  - type: textarea
    id: local_app
    attributes:
      label: Local app details
      description: Complete this when app detection or sharing is involved.
      placeholder: |
        Local URL: http://localhost:3000
        Framework/runtime: Vite, ASP.NET Core, Node, Docker, WSL, etc.
        Host environment: Windows, Linux, WSL, or Docker
        Does the URL open locally in a browser?
        Discovery diagnostic reason:

  - type: textarea
    id: network
    attributes:
      label: Network details
      description: Complete this for LAN, public-link readiness, DNS, proxy, or VPN problems. Do not post private addresses unless needed and safe.
      placeholder: |
        LAN or public sharing:
        Wi-Fi / Ethernet:
        VPN or proxy:
        Same subnet or guest Wi-Fi:
        Output of `ghs doctor` after removing sensitive values:

  - type: textarea
    id: linux_desktop
    attributes:
      label: Linux desktop details
      description: Linux only. Include this for tray, focus, window, or desktop integration problems.
      render: shell
      placeholder: |
        echo $XDG_CURRENT_DESKTOP
        echo $XDG_SESSION_TYPE
        echo $DESKTOP_SESSION

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add screenshots, safe logs, or notes after removing secrets.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I checked the Troubleshooting guide and the latest release.
          required: true
        - label: I removed tokens, passwords, private URLs, customer data, and other secrets.
          required: true
