name: Feature request
description: Suggest a user-facing GhostlyShare improvement.
title: "[Feature]: "
labels:
  - enhancement
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem, the preferred workflow, and why the current behavior is not enough.

        Do not paste Cloudflare API tokens, passwords, private URLs, customer data, or logs containing secrets.

  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Desktop app
        - ghs CLI
        - Both
        - Documentation or downloads
        - Not product-specific
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Windows with WSL
        - Ubuntu / Debian Linux
        - Arch Linux
        - Fedora / openSUSE / RHEL-compatible Linux
        - Other Linux desktop
        - Docker workload
        - All platforms
        - Not platform-specific
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App detection
        - Discovery diagnostics
        - LAN sharing
        - Go Public / random URL
        - Custom domain
        - Password protection
        - Link lifetime
        - Traffic statistics
        - Browser opening
        - CLI or JSON output
        - Cloudflare setup or cleanup
        - Tray icon or window behavior
        - Installation, update, or uninstall
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and what makes it difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe the simplest behavior that would solve the problem.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: Show a short desktop or CLI example when useful.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives tried
      description: What workaround do you use today?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples or links after removing sensitive information.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: This is a user-facing request, not a request for private source code or implementation details.
          required: true
        - label: I removed tokens, passwords, private URLs, customer data, and other secrets.
          required: true
